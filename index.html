<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f7" />

  <title>シフト管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      padding-bottom: 90px;
    }

    .header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #777;
      font-size: 14px;
    }

    .page {
      display: none;
      padding: 20px;
    }

    .page.active {
      display: block;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4e4e4;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .big-text {
      font-size: 26px;
      font-weight: 700;
      margin: 4px 0;
    }

    .sub-text {
      color: #777;
      font-size: 14px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid #ddd;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav button {
      border: none;
      background: transparent;
      padding: 8px 2px;
      font-size: 11px;
      color: #777;
      cursor: pointer;
    }

    .nav button.active {
      color: #111;
      font-weight: 700;
    }

    .nav .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      background: #222;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .placeholder {
      text-align: center;
      color: #888;
      padding: 40px 20px;
      border: 2px dashed #ddd;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <h1 id="pageTitle">ホーム</h1>
      <p>自分専用のシフト管理</p>
    </header>

    <main>

      <!-- ホーム -->
      <section id="home" class="page active">
        <div class="card">
          <h2>次の勤務</h2>
          <div class="big-text">まだ登録されていません</div>
          <div class="sub-text">
            シフトを登録するとここに表示されます
          </div>
        </div>

        <div class="card">
          <h2>今月の勤務</h2>
          <div class="big-text">0日</div>
          <div class="sub-text">
            合計勤務時間 0時間
          </div>
        </div>

        <button
          class="primary-button"
          data-page="register"
        >
          シフトを登録する
        </button>
      </section>

      <!-- カレンダー -->
      <section id="calendar" class="page">
        <div class="placeholder">
          カレンダーはここに作ります
        </div>
      </section>

      <!-- シフト登録 -->
      <section id="register" class="page">
        <div class="card">
          <h2>シフト登録</h2>

          <p class="sub-text">
            勤務テンプレートを選んで登録できるようにします。
          </p>
        </div>

        <div class="placeholder">
          シフト登録画面
        </div>
      </section>

      <!-- 集計 -->
      <section id="summary" class="page">
        <div class="card">
          <h2>今月の集計</h2>
          <div class="big-text">0時間</div>
          <div class="sub-text">
            勤務日数 0日
          </div>
        </div>

        <div class="placeholder">
          給与や勤務時間の集計を表示します
        </div>
      </section>

      <!-- 設定 -->
      <section id="settings" class="page">
        <div class="card">
          <h2>勤務テンプレート</h2>

          <p class="sub-text">
            早番・遅番・夜勤などを登録できるようにします。
          </p>
        </div>

        <div class="placeholder">
          テンプレート設定画面
        </div>
      </section>

    </main>

    <nav class="nav">

      <button
        class="nav-button active"
        data-page="home"
      >
        <span class="icon">🏠</span>
        ホーム
      </button>

      <button
        class="nav-button"
        data-page="calendar"
      >
        <span class="icon">📅</span>
        カレンダー
      </button>

      <button
        class="nav-button"
        data-page="register"
      >
        <span class="icon">＋</span>
        登録
      </button>

      <button
        class="nav-button"
        data-page="summary"
      >
        <span class="icon">📊</span>
        集計
      </button>

      <button
        class="nav-button"
        data-page="settings"
      >
        <span class="icon">⚙️</span>
        設定
      </button>

    </nav>

  </div>

  <script>
    const pages = document.querySelectorAll(".page");
    const navButtons = document.querySelectorAll(".nav-button");
    const pageTitle = document.getElementById("pageTitle");

    const titles = {
      home: "ホーム",
      calendar: "カレンダー",
      register: "シフト登録",
      summary: "集計",
      settings: "設定"
    };

    function showPage(pageId) {
      pages.forEach(page => {
        page.classList.remove("active");
      });

      document
        .getElementById(pageId)
        .classList.add("active");

      navButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.page === pageId
        );
      });

      pageTitle.textContent = titles[pageId];

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    document
      .querySelectorAll("[data-page]")
      .forEach(button => {
        button.addEventListener("click", () => {
          showPage(button.dataset.page);
        });
      });
  </script>

</body>
</html>
